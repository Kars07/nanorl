[env]
id = ""
max_concurrent_agents = 1

[env.taskset]
id = "tiny-repo-repair-v1"
num_tasks = 16
start = 0

[env.taskset.task]
judges = []

[env.taskset.task.stops]

[env.taskset.task.metrics]

[env.taskset.task.rewards]

[env.taskset.task.e2b]
colocated = false
timeout_seconds = 240
command_timeout_seconds = 120
max_output_chars = 20000
allow_internet_access = false

[env.taskset.task.e2b.runtime]
type = "subprocess"

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 32

[env.agent]
max_turns = 4

[env.agent.harness]
id = "null"
forward_env = []
tool_timeout = 600.0
skills = []

[env.agent.harness.env]

[env.agent.runtime]
type = "subprocess"

[env.agent.timeout]

[env.agent.retries]
max_retries = 0
include = []
exclude = []

[serve]
address = "tcp://127.0.0.1:5000"

[serve.pool]
type = "elastic"
multiplex = 128

[log]
level = "info"
json_logging = false
