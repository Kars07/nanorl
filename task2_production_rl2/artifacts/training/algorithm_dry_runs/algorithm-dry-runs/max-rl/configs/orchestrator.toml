pre_batch_filters = [
    { type = "gibberish", enforce = false, token_id_threshold = 100000, logprob_offset = 2.0 },
    { type = "repetition", enforce = false, window = 3000, prob_threshold = 0.99 },
    { type = "zero_advantage", enforce = false },
]
post_batch_filters = [
    { type = "gibberish", enforce = false, token_id_threshold = 100000, logprob_offset = 2.0 },
    { type = "repetition", enforce = false, window = 3000, prob_threshold = 0.99 },
    { type = "zero_advantage", enforce = true },
]
collect_inference_metrics = true
output_dir = "/outputs/algorithm-dry-runs/max-rl"
env_server_base_port = 5000
batch_size = 4
max_inflight_episodes = 4
group_size = 4
seq_len = 4096
num_train_workers = 1
pad_to_multiple_of = 1
max_steps = 2
max_off_policy_steps = 8
bench = false

[algo]
type = "max_rl"

[algo.sampling]
source = "policy"

[model]
name = "Qwen/Qwen3-0.6B"
trust_remote_code = false

[model.client]
