model = "Qwen/Qwen3-0.6B"
reflection_model = "Qwen/Qwen3-0.6B"
num_train = 2
num_val = 1
shuffle = false
seed = 0
max_total_rollouts = 6
reflection_minibatch_size = 1
max_concurrent = 1

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "TASK2_LOCAL_INFERENCE_KEY"

[reflection_client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "TASK2_LOCAL_INFERENCE_KEY"

[sampling]
max_tokens = 64
temperature = 0.7

[env.taskset]
id = "learning-harness"
num_tasks = 3

[env.agent]
max_turns = 1

[env.agent.harness]
id = "learning-harness"

[env.agent.runtime]
type = "subprocess"
