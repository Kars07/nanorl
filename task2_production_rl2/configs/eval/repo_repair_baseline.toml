model = "Qwen/Qwen3-0.6B"
num_tasks = 20
num_rollouts = 1
shuffle = false
push = false

[env.taskset]
id = "tiny-repo-repair-v1"
num_tasks = 20

[env.taskset.task.e2b]
allow_internet_access = false
timeout_seconds = 900
command_timeout_seconds = 120
max_output_chars = 20000

[env.agent]
max_turns = 8

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "TASK2_LOCAL_INFERENCE_KEY"
type = "eval"

[sampling]
max_tokens = 1024
