max_steps = 2
seq_len = 4096

[model]
name = "Qwen/Qwen3-0.6B"

[orchestrator]
batch_size = 4
group_size = 4
max_inflight_episodes = 4

[orchestrator.algo]
type = "hierarchical_grpo"
episode_agents = ["solver"]

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.source]]
name = "proposer-solver"
group_size = 4
[orchestrator.train.source.env]
n = 2
[orchestrator.train.source.env.taskset]
id = "proposer-solver-v1"
[orchestrator.train.source.env.proposer]
max_turns = 4
[orchestrator.train.source.env.proposer.harness]
id = "null"
[orchestrator.train.source.env.proposer.runtime]
type = "subprocess"
[orchestrator.train.source.env.solver]
max_turns = 4
[orchestrator.train.source.env.solver.harness]
id = "null"
[orchestrator.train.source.env.solver.runtime]
type = "subprocess"

[trainer.optim]
lr = 1e-6

[inference]

[orchestrator.renderer]
name = "qwen3"
