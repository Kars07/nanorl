max_steps = 1
seq_len = 4096

[model]
name = "Qwen/Qwen3-0.6B"

[orchestrator]
batch_size = 4
group_size = 4
max_inflight_episodes = 4
# ECHO has a CE signal on tool observations even when group-relative RL
# advantages are zero. The default zero_advantage post-filter only sees the
# RL stream and would incorrectly discard those CE-bearing samples.
pre_batch_filters = []
post_batch_filters = []

[orchestrator.algo]
type = "echo"

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.source]]
name = "terminal-echo"
[orchestrator.train.source.env.taskset]
id = "tiny-terminal-v1"
[orchestrator.train.source.env.agent]
max_turns = 8
[orchestrator.train.source.env.agent.harness]
id = "null"
[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[trainer.optim]
lr = 1e-6

[inference]

[orchestrator.renderer]
name = "qwen3"
