[project]
name = "tiny-repo-repair-v1"
version = "0.1.0"
description = "Deterministic repository repair tasks executed in E2B sandboxes."
requires-python = ">=3.11"
dependencies = ["e2b==2.35.0", "verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_repo_repair_v1"]

