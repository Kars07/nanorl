[project]
name = "task2-production-rl"
version = "0.1.0"
description = "Production RL Systems: Prime-RL + Verifiers + Slime + Training/Inference Boundary Laboratory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ray>=2.10.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.14.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
    "modal>=0.60.0",
    "pyzmq>=25.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.30.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/prime_rl",
    "src/slime",
    "ray_lab",
    "mismatch_probe",
    "prime_rl_lab",
    "slime_lab",
    "failure_lab",
]

[tool.pytest.ini_options]
testpaths = ["tests", "ray_lab/tests"]
python_files = "test_*.py"
markers = [
    "gpu: mark test to run on GPU",
    "integration: mark test as integration test",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741", "F841"]
