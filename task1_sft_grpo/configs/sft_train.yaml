model_id: "Qwen/Qwen2.5-0.5B-Instruct"
tokenizer_id: "Qwen/Qwen2.5-0.5B-Instruct"
seed: 42
max_seq_length: 512
dataset_name_or_path: "data/processed/sft_data.jsonl"
train_split: "train"
eval_split: "eval"
assistant_only_loss: true
batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2e-5
weight_decay: 0.01
num_epochs: 3
warmup_ratio: 0.05
output_dir: "artifacts/checkpoints/sft_final"
dtype: "bfloat16"
grad_clip: 1.0
allow_zero_supervised_tokens: false
